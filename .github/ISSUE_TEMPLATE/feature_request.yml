name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like OpenPDF to do? A sketch of the API you would want to call is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other libraries that already do this.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant PDF spec sections (ISO 32000), sample PDFs or screenshots.
