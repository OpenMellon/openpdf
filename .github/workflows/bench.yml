name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two commits are enough: for a push or a pull request merge commit, HEAD^1 is the code being compared against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Benchmark base and head
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q HEAD^1 >/dev/null; then
            echo "no parent commit to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          # The benchmarks live in the head commit; run the same file against the base so both measure the same thing.
          cp internal/regress/bench_test.go "$RUNNER_TEMP/base/internal/regress/bench_test.go"
          bench() { (cd "$1" && go test ./internal/regress -run '^$' -bench . -benchtime 200ms -count 1) >> "$2"; }
          # Build both test binaries once; a base that cannot build the benchmarks (an API changed in this commit)
          # is a skipped comparison, not a regression.
          if ! (cd "$RUNNER_TEMP/base" && go test -c -o /dev/null ./internal/regress); then
            echo "base commit cannot build the benchmarks; comparison skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Alternate base and head so runner drift affects both sides equally.
          : > "$RUNNER_TEMP/base.txt"; : > "$RUNNER_TEMP/head.txt"
          for _ in 1 2 3 4 5 6; do
            bench "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.txt"
            bench "$PWD" "$RUNNER_TEMP/head.txt"
          done
          benchstat "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | tee "$RUNNER_TEMP/benchstat.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/benchstat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          benchstat -format csv "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" > "$RUNNER_TEMP/benchstat.csv"
          python3 scripts/bench_compare.py "$RUNNER_TEMP/benchstat.csv" 25 | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            ${{ runner.temp }}/base.txt
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/benchstat.txt
            ${{ runner.temp }}/benchstat.csv
          if-no-files-found: ignore
