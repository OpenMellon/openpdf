repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^(pkcs7|timestamp)/

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      # Go Vet
      - id: go-vet-mod

      # Go Mod Tidy
      - id: go-mod-tidy-repo

      # Go Test
      - id: go-test-repo-mod

  # Formatters, pinned as tools in go.mod (no separate install needed)
  - repo: local
    hooks:
      - id: goimports
        name: goimports
        entry: go tool goimports -w
        language: system
        types: [go]
      - id: gofumpt
        name: gofumpt
        entry: go tool gofumpt -w
        language: system
        types: [go]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
